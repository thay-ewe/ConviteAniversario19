<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Fonte Assinatura</title>
    
    <!-- Importando as fontes de assinatura do Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Alex+Brush&family=Great+Vibes&family=Satisfy&display=swap" rel="stylesheet">
  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dr+Sugiyama&display=swap" rel="stylesheet">

    <style>
        /* Estilo para o texto normal do site (sem ser bastão) */
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f9f9f9;
            color: #333;
        }

        /* Classes para o efeito de assinatura */
        .assinatura-1 {
            font-family: 'Great Vibes', cursive;
            font-size: 45px;
            font-weight: 500;
        }

        .assinatura-2 {
            font-family: 'Alex Brush', cursive;
            font-size: 45px;
        }

        .assinatura-3 {
            font-family: 'Satisfy', cursive;
            font-size: 35px;
        }
        .assinatura-4{
            font-family: "Dr Sugiyama", cursive;
            font-weight: 400;
            font-style: normal;
            font-size: 35px;
            color: #A56BB8;
        }
    </style>
</head>
<body>

    <p>Opção 1 (Mais clássica):</p>
    <div class="assinatura-1">Seu Nome Aqui</div>
    
    <hr>

    <p>Opção 2 (Mais fina e fluida):</p>
    <div class="assinatura-2">Seu Nome Aqui</div>
    
    <hr>

    <p>Opção 3 (Mais moderna e legível):</p>
    <div class="assinatura-3">Seu Nome Aqui</div>

    <p>Opção 4</p>
    <div class="assinatura-4">Thayanne Ewellin</div>

</body>
</html>
